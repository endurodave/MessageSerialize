name: Windows

on:
  push:
    branches:
      - main  # Trigger on push 
  pull_request:
    branches:
      - main  # Trigger on pull 

jobs:
  build:
    runs-on: windows-2022  # Pinned: windows-latest no longer has Visual Studio 2022
    name: build (${{ matrix.memory }})
    strategy:
      fail-fast: false
      matrix:
        # heap: global heap (default). allocator: fixed-block allocator (allocator/)
        memory: [heap, allocator]
        include:
          - memory: heap
            allocator: OFF
          - memory: allocator
            allocator: ON

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Checkout the repository code

    - name: Set up Visual Studio
      uses: microsoft/setup-msbuild@v2  # Set up Visual Studio environment (MSBuild)

    - name: Configure CMake
      run: cmake -S . -B build -DMSG_SERIALIZE_ALLOCATOR=${{ matrix.allocator }}  # Default generator: the installed Visual Studio

    - name: Build
      run: cmake --build build --config Release  # Build the project using CMake with Release configuration

    - name: Run Serializer
      run: .\build\Release\Serializer.exe  # Run the built executable (adjust path for MSBuild)
